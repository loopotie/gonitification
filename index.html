<!doctype html>
<html lang="en">
<head>
  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mathification</title>
    <!-- Paste your icon code right here: -->
    <link rel="icon" type="image/png" href="Favicon.png">
</head>
<body>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Math Notepad</title>
  <link rel="stylesheet" href="vendor/mathlive/mathlive-fonts.css">
  <script defer src="vendor/mathlive/mathlive.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; }
    html, body { min-height: 100%; margin: 0; background: #000; }
    body { color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #app-shell { min-height: 100vh; display: grid; grid-template-columns: 270px minmax(0, 1fr); background: #000; transition: grid-template-columns .2s ease; }
    #sidebar {
      width: 270px;
      min-width: 0;
      height: 100vh;
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 17px 12px 14px;
      border-right: 1px solid #1d1d1d;
      background: #000;
      overflow: hidden;
    }
    body.sidebar-collapsed #app-shell { grid-template-columns: 0 minmax(0, 1fr); }
    body.sidebar-collapsed #sidebar { width: 0; padding-left: 0; padding-right: 0; border-right: 0; opacity: 0; pointer-events: none; }
    #sidebar-brand { padding: 0 9px; font-size: 15px; font-weight: 650; letter-spacing: .01em; }
    #sidebar-actions { display: flex; gap: 7px; }
    .ui-button {
      border: 1px solid #292929;
      border-radius: 7px;
      padding: 8px 10px;
      background: #080808;
      color: #eee;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .ui-button:hover { background: #151515; }
    #new-note { flex: 1; }
    #folder-heading, #unfiled-heading { padding: 0 9px; color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; }
    #folder-tree, #unfiled-list { display: grid; gap: 2px; }
    #folder-tree { min-height: 22px; }
    #tree-scroll { min-height: 0; flex: 1; overflow-y: auto; }
    .folder-group { min-width: 0; }
    .folder-children { margin-left: 15px; padding-left: 5px; border-left: 1px solid #222; }
    .folder-row, .note-row { display: flex; align-items: center; gap: 3px; min-width: 0; border-radius: 6px; }
    .dragging { opacity: .48; }
    .folder-row:hover, .note-row:hover { background: #111; }
    .folder-row.drop-target, .note-row.drop-target, .tree-drop.drop-target { background: #191919; outline: 1px solid #555; }
    .folder-toggle, .folder-title, .note-open, .folder-add, .note-save {
      min-width: 0;
      border: 0;
      background: transparent;
      color: #ddd;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .folder-toggle { width: 24px; padding: 6px 0; color: #888; }
    .folder-title, .note-open { flex: 1; overflow: hidden; padding: 7px 2px; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .folder-add { width: 25px; padding: 5px 0; color: #999; font-size: 16px; }
    .note-row { padding-left: 24px; }
    .note-open { color: #bbb; }
    .note-row[aria-current="true"] { background: #191919; }
    .note-row[aria-current="true"] .note-open { color: #fff; }
    .tree-drop { min-height: 34px; padding: 8px 9px; border-radius: 6px; color: #aaa; font-size: 13px; }
    #unfiled-list { max-height: 38vh; overflow-y: auto; }
    #workspace { min-width: 0; min-height: 100vh; display: flex; flex-direction: column; background: #000; }
    #topbar {
      min-height: 58px;
      padding: 12px clamp(24px, 5vw, 72px) 0;
      display: flex;
      align-items: center;
      gap: 13px;
    }
    #note-title {
      min-width: 0;
      flex: 1;
      padding: 7px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      font-size: 18px;
    }
    #note-title::placeholder { color: #777; }
    #save-status { min-width: 88px; color: #777; font-size: 12px; white-space: nowrap; }
    #top-actions { display: flex; gap: 7px; }
    #page { flex: 1; min-height: calc(100vh - 58px); padding: 30px clamp(24px, 5vw, 72px) 46px; background: #000; }
    math-field#equations {
      display: block;
      width: 100%;
      min-height: 1.8em;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: clamp(23px, 3vw, 32px);
      line-height: 1.65;
      --caret-color: #fff;
      --selection-background-color: #292929;
      --selection-color: #fff;
      --highlight-text: transparent;
      --text-highlight-background-color: transparent;
      --contains-highlight-background-color: transparent;
    }
    math-field#equations:focus { outline: none; }
    #folder-dialog { width: min(360px, calc(100vw - 32px)); padding: 0; border: 1px solid #333; border-radius: 10px; background: #090909; color: #fff; }
    #folder-dialog::backdrop { background: #000a; }
    #folder-form { display: grid; gap: 14px; padding: 20px; }
    #folder-form h2 { margin: 0; font-size: 17px; }
    #folder-name { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 6px; background: #000; color: #fff; font: inherit; }
    #folder-form-actions { display: flex; justify-content: flex-end; gap: 8px; }
    #sidebar-toggle { display: inline-flex; }
    @media (max-width: 760px) {
      #app-shell { display: block; }
      #sidebar { width: min(290px, 85vw); position: fixed; left: 0; z-index: 5; transform: translateX(-102%); transition: transform .18s ease; }
      body.sidebar-open #sidebar { transform: translateX(0); }
      #sidebar-toggle { display: inline-flex; }
      #topbar { padding: 12px 18px 0; gap: 8px; }
      #top-actions { gap: 5px; }
      #note-title { font-size: 16px; }
      #save-status { min-width: 0; font-size: 11px; }
      .ui-button { padding: 7px 8px; }
      #page { padding: 24px 20px 40px; }
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <aside id="sidebar" aria-label="Notes and folders">
      <div id="sidebar-brand">Math Notepad</div>
      <div id="sidebar-actions">
        <button id="new-note" class="ui-button" type="button">＋ New note</button>
        <button id="new-folder" class="ui-button" type="button">＋ Folder</button>
      </div>
      <div id="folder-heading">Folders</div>
      <div id="tree-scroll">
        <div id="folder-root-drop" class="tree-drop" aria-label="Drop a folder here to move it to the top level">All folders</div>
        <div id="folder-tree"></div>
      </div>
      <div id="unfiled-heading" class="tree-drop">Unfiled notes</div>
      <div id="unfiled-list" aria-label="Unfiled notes"></div>
    </aside>
    <section id="workspace">
      <header id="topbar">
        <button id="sidebar-toggle" class="ui-button" type="button" aria-label="Toggle sidebar" aria-expanded="true">☰</button>
        <input id="note-title" type="text" maxlength="100" placeholder="Untitled note" aria-label="Note title">
        <span id="save-status" aria-live="polite"></span>
        <nav id="top-actions" aria-label="Note actions">
          <button id="save-note" class="ui-button" type="button">Save</button>
          <button id="import-note" class="ui-button" type="button">Import</button>
          <button id="export-note" class="ui-button" type="button">Export</button>
        </nav>
      </header>
      <main id="page" aria-label="Math notepad">
        <math-field id="equations" math-virtual-keyboard-policy="manual" smart-mode smart-superscript aria-label="Multiline math notepad"></math-field>
      </main>
    </section>
  </div>
  <dialog id="folder-dialog">
    <form id="folder-form">
      <h2 id="folder-dialog-title">New folder</h2>
      <input id="folder-name" type="text" maxlength="80" required aria-label="Folder name" placeholder="Folder name">
      <div id="folder-form-actions">
        <button id="cancel-folder" class="ui-button" type="button">Cancel</button>
        <button class="ui-button" type="submit">Create</button>
      </div>
    </form>
  </dialog>
  <script>
    (() => {
      const field = document.querySelector('#equations');
      const titleInput = document.querySelector('#note-title');
      const saveStatus = document.querySelector('#save-status');
      const folderTree = document.querySelector('#folder-tree');
      const unfiledList = document.querySelector('#unfiled-list');
      const folderDialog = document.querySelector('#folder-dialog');
      const folderForm = document.querySelector('#folder-form');
      const folderNameInput = document.querySelector('#folder-name');
      const folderDialogTitle = document.querySelector('#folder-dialog-title');

      customElements.whenDefined('math-field').then(() => {
        const notesKey = 'math-notepad-library-v1';
        const foldersKey = 'math-notepad-folders-v1';
        const currentKey = 'math-notepad-current-v1';
        const oldDraftKey = 'math-notepad-document-v1';
        let notes = readStoredJson(notesKey, []);
        let folders = readStoredJson(foldersKey, []);
        if (!Array.isArray(notes)) notes = [];
        if (!Array.isArray(folders)) folders = [];
        let currentId = null;
        let folderParentForDialog = null;
        let normalWritingMode = false;

        function readStoredJson(key, fallback) {
          try {
            const value = localStorage.getItem(key);
            return value ? JSON.parse(value) : fallback;
          } catch (_) { return fallback; }
        }

        function makeId() {
          return globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }

        function currentTitle() {
          return titleInput.value.trim() || 'Untitled note';
        }

        function writeNotes() {
          try { localStorage.setItem(notesKey, JSON.stringify(notes)); } catch (_) {}
        }

        function writeFolders() {
          try { localStorage.setItem(foldersKey, JSON.stringify(folders)); } catch (_) {}
        }

        function saveDraft() {
          const state = { id: currentId, title: titleInput.value, latex: field.value };
          saveStatus.textContent = currentId ? 'Saved' : 'Draft saved';
          try {
            localStorage.setItem(currentKey, JSON.stringify(state));
            localStorage.setItem(oldDraftKey, field.value);
          } catch (_) {}

          if (currentId) {
            const index = notes.findIndex(note => note.id === currentId);
            if (index >= 0) {
              notes[index] = { ...notes[index], title: currentTitle(), latex: field.value, updatedAt: Date.now() };
              writeNotes();
              renderTree();
            }
          }
        }

        function saveNote() {
          const latex = field.value || '\\displaylines{}';
          const index = notes.findIndex(note => note.id === currentId);
          const previous = index >= 0 ? notes[index] : null;
          const note = {
            id: currentId || makeId(),
            title: currentTitle(),
            latex,
            folderId: previous?.folderId || null,
            createdAt: previous?.createdAt || Date.now(),
            updatedAt: Date.now()
          };
          currentId = note.id;
          if (index >= 0) notes[index] = note;
          else notes.unshift(note);
          titleInput.value = note.title;
          saveStatus.textContent = 'Saved to Notes';
          writeNotes();
          saveDraft();
          renderTree();
        }

        function openNote(note) {
          currentId = note.id;
          titleInput.value = note.title;
          field.value = note.latex || '\\displaylines{}';
          saveStatus.textContent = 'Saved';
          try { localStorage.setItem(currentKey, JSON.stringify({ id: currentId, title: titleInput.value, latex: field.value })); } catch (_) {}
          renderTree();
          closeMobileSidebar();
          focusEditor();
        }

        function newNote() {
          currentId = null;
          titleInput.value = '';
          field.value = '\\displaylines{}';
          saveStatus.textContent = 'New draft';
          saveDraft();
          closeMobileSidebar();
          focusEditor();
        }

        function makeNoteRow(note) {
          const row = document.createElement('div');
          row.className = 'note-row';
          row.draggable = true;
          row.setAttribute('aria-current', String(note.id === currentId));
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'note-open';
          button.textContent = note.title || 'Untitled note';
          button.title = button.textContent;
          button.addEventListener('click', () => openNote(note));
          row.append(button);
          row.addEventListener('dragstart', event => beginDrag(event, 'note', note.id));
          row.addEventListener('dragend', () => row.classList.remove('dragging'));
          addDropBehavior(row, note.folderId || null, !note.folderId);
          return row;
        }

        function makeFolderNode(folder) {
          const group = document.createElement('div');
          group.className = 'folder-group';
          const row = document.createElement('div');
          row.className = 'folder-row';
          row.draggable = true;
          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'folder-toggle';
          toggle.textContent = folder.expanded === false ? '›' : '⌄';
          toggle.setAttribute('aria-expanded', String(folder.expanded !== false));
          toggle.setAttribute('aria-label', `${folder.expanded === false ? 'Expand' : 'Collapse'} ${folder.name}`);
          toggle.addEventListener('click', () => {
            folder.expanded = folder.expanded === false;
            writeFolders();
            renderTree();
          });
          const name = document.createElement('button');
          name.type = 'button';
          name.className = 'folder-title';
          name.textContent = folder.name;
          name.title = folder.name;
          name.addEventListener('click', () => {
            folder.expanded = folder.expanded === false;
            writeFolders();
            renderTree();
          });
          const add = document.createElement('button');
          add.type = 'button';
          add.className = 'folder-add';
          add.textContent = '+';
          add.title = `Create a subfolder in ${folder.name}`;
          add.setAttribute('aria-label', add.title);
          add.addEventListener('click', () => openFolderDialog(folder.id));
          row.append(toggle, name, add);
          row.addEventListener('dragstart', event => beginDrag(event, 'folder', folder.id));
          row.addEventListener('dragend', () => row.classList.remove('dragging'));
          addDropBehavior(row, folder.id, false);
          group.append(row);

          if (folder.expanded !== false) {
            const children = document.createElement('div');
            children.className = 'folder-children';
            folders.filter(child => child.parentId === folder.id).sort(sortByName).forEach(child => children.append(makeFolderNode(child)));
            notes.filter(note => note.folderId === folder.id).sort(sortByUpdated).forEach(note => children.append(makeNoteRow(note)));
            group.append(children);
          }
          return group;
        }

        function sortByName(a, b) { return String(a.name).localeCompare(String(b.name)); }
        function sortByUpdated(a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }

        function renderTree() {
          folderTree.replaceChildren();
          unfiledList.replaceChildren();
          folders.filter(folder => !folder.parentId).sort(sortByName).forEach(folder => folderTree.append(makeFolderNode(folder)));
          notes.filter(note => !note.folderId || !folders.some(folder => folder.id === note.folderId)).sort(sortByUpdated).forEach(note => unfiledList.append(makeNoteRow(note)));
        }

        function beginDrag(event, kind, id) {
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', JSON.stringify({ kind, id }));
          event.currentTarget.classList.add('dragging');
        }

        function addDropBehavior(element, folderId, isRoot) {
          element.addEventListener('dragover', event => {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            element.classList.add('drop-target');
          });
          element.addEventListener('dragleave', event => {
            if (!element.contains(event.relatedTarget)) element.classList.remove('drop-target');
          });
          element.addEventListener('drop', event => {
            event.preventDefault();
            event.stopPropagation();
            element.classList.remove('drop-target');
            let item;
            try { item = JSON.parse(event.dataTransfer.getData('text/plain')); } catch (_) { return; }
            if (item.kind === 'note') {
              const note = notes.find(entry => entry.id === item.id);
              if (!note) return;
              note.folderId = isRoot ? null : folderId;
              note.updatedAt = Date.now();
              writeNotes();
              renderTree();
            } else if (item.kind === 'folder') {
              const folder = folders.find(entry => entry.id === item.id);
              if (!folder || folder.id === folderId || (folderId && isInsideFolder(folderId, folder.id))) return;
              folder.parentId = isRoot ? null : folderId;
              folder.expanded = true;
              const parent = folders.find(entry => entry.id === folderId);
              if (parent) parent.expanded = true;
              writeFolders();
              renderTree();
            }
          });
        }

        function isInsideFolder(folderId, possibleAncestorId) {
          let current = folders.find(folder => folder.id === folderId);
          while (current) {
            if (current.id === possibleAncestorId) return true;
            current = folders.find(folder => folder.id === current.parentId);
          }
          return false;
        }

        function openFolderDialog(parentId = null) {
          folderParentForDialog = parentId;
          const parent = folders.find(folder => folder.id === parentId);
          folderDialogTitle.textContent = parent ? `New subfolder in ${parent.name}` : 'New folder';
          folderNameInput.value = '';
          folderDialog.showModal();
          requestAnimationFrame(() => folderNameInput.focus());
        }

        function focusEditor() {
          requestAnimationFrame(() => {
            field.focus();
            try { field.executeCommand('moveToMathfieldEnd'); } catch (_) {}
          });
        }

        function isMobileLayout() {
          return window.matchMedia('(max-width: 760px)').matches;
        }

        function syncSidebarButton() {
          const expanded = isMobileLayout()
            ? document.body.classList.contains('sidebar-open')
            : !document.body.classList.contains('sidebar-collapsed');
          document.querySelector('#sidebar-toggle').setAttribute('aria-expanded', String(expanded));
        }

        function closeMobileSidebar() {
          if (isMobileLayout()) document.body.classList.remove('sidebar-open');
          syncSidebarButton();
        }

        field.inlineShortcuts = {
          ...field.inlineShortcuts,
          theta: '\\theta',
          pi: '\\pi',
          sqrt: '\\sqrt',
          sin: '\\sin',
          cos: '\\cos',
          tan: '\\tan'
        };
        field.onInlineShortcut = (_mathfield, typed) => typed === 'root' ? '\\sqrt' : '';

        function downloadTex() {
          const source = field.value || '\\displaylines{}';
          const displayLines = source.match(/^\\displaylines\{([\s\S]*)\}$/);
          const mathBody = displayLines
            ? `\\begin{gather*}${displayLines[1]}\\end{gather*}`
            : `\\begin{gather*}${source}\\end{gather*}`;
          const documentText = [
            '\\documentclass{article}',
            '\\usepackage{amsmath}',
            '\\begin{document}',
            mathBody,
            '\\end{document}',
            ''
          ].join('\n');
          const blob = new Blob([documentText], { type: 'application/x-tex;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          const safeTitle = currentTitle().replaceAll('/', '-').replace(/[<>:"\\|?*\u0000-\u001f]/g, '-').replace(/\s+/g, ' ').trim() || 'Untitled note';
          link.download = `${safeTitle}.tex`;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        const filePicker = document.createElement('input');
        filePicker.type = 'file';
        filePicker.accept = '.tex,.txt,text/plain';
        filePicker.hidden = true;
        document.body.append(filePicker);
        filePicker.addEventListener('change', async () => {
          const file = filePicker.files?.[0];
          if (!file) return;
          try {
            const contents = await file.text();
            const displayMath = contents.match(/\\\[\s*([\s\S]*?)\s*\\\]/);
            const gather = contents.match(/\\begin\{gather\*\}([\s\S]*?)\\end\{gather\*\}/);
            const importedMath = gather
              ? `\\displaylines{${gather[1]}}`
              : (displayMath ? displayMath[1] : contents);
            field.value = importedMath.trim() || '\\displaylines{}';
            currentId = null;
            titleInput.value = file.name.replace(/\.[^.]+$/, '');
            saveDraft();
            saveStatus.textContent = 'Imported draft';
            focusEditor();
          } catch (_) {}
          filePicker.value = '';
        });

        window.addEventListener('keydown', event => {
          const command = event.metaKey || event.ctrlKey;
          const key = event.key.toLowerCase();
          if (command && key === 's') {
            event.preventDefault(); event.stopImmediatePropagation();
            if (event.shiftKey) downloadTex();
            else saveNote();
          } else if (command && event.shiftKey && key === 'o') {
            event.preventDefault(); event.stopImmediatePropagation();
            filePicker.click();
          } else if (event.ctrlKey && !event.metaKey && (key === '/' || key === '?' || event.code === 'Slash')) {
            event.preventDefault(); event.stopImmediatePropagation();
            normalWritingMode = !normalWritingMode;
            field.executeCommand(['switchMode', normalWritingMode ? 'text' : 'math']);
            field.focus();
          }
        }, true);

        function currentRowIsEmpty() {
          try {
            if (!field.selectionIsCollapsed) return false;
            const caret = field.position;
            const left = unwrapDisplayLines(field.getValue(0, caret, 'latex'));
            const right = unwrapDisplayLines(field.getValue(caret, field.lastOffset, 'latex'));
            const current = `${splitTopLevelRows(left).pop() || ''}${splitTopLevelRows(right)[0] || ''}`;
            if (/\\begin\s*\{/.test(current)) return false;
            return current.replace(/\\text\{\s*\}/g, '').replace(/\s+/g, '') === '';
          } catch (_) {
            return false;
          }
        }

        let caretScrollFrame = 0;
        function scheduleCaretScroll() {
          if (caretScrollFrame) cancelAnimationFrame(caretScrollFrame);
          caretScrollFrame = requestAnimationFrame(() => {
            caretScrollFrame = requestAnimationFrame(() => {
              caretScrollFrame = 0;
              if (!field.hasFocus()) return;

              // MathLive renders the insertion point inside its open shadow root.
              // Fall back to its public element bounds if the caret marker is absent.
              let caret = field.shadowRoot?.querySelector('.ML__caret, .ML__text-caret');
              let bounds = caret?.getBoundingClientRect();
              if (!bounds || bounds.height === 0) {
                try { bounds = field.getElementInfo(field.position)?.bounds; }
                catch (_) { bounds = null; }
              }
              if (!bounds) return;

              // Leave the cursor near the top while there is room, then keep it
              // around the viewport center as new rows are added below.
              const triggerY = window.innerHeight * 0.6;
              if (bounds.bottom <= triggerY) return;

              const centerY = bounds.top + bounds.height / 2;
              const targetY = window.innerHeight * 0.5;
              const distance = centerY - targetY;
              if (distance <= 24) return;

              window.scrollTo({
                top: Math.max(0, window.scrollY + distance),
                behavior: 'smooth'
              });
            });
          });
        }

        function unwrapDisplayLines(latex) {
          return latex.replace(/^\\displaylines\{/, '').replace(/\}$/, '');
        }

        function splitTopLevelRows(latex) {
          const rows = [];
          let depth = 0;
          let start = 0;
          for (let i = 0; i < latex.length; i++) {
            if (latex[i] === '{') depth++;
            else if (latex[i] === '}') depth = Math.max(0, depth - 1);
            else if (latex[i] === '\\' && latex[i + 1] === '\\' && depth === 0) {
              rows.push(latex.slice(start, i));
              i++;
              start = i + 1;
            } else if (latex[i] === '\\' && latex[i + 1] === '\\') {
              i++;
            }
          }
          rows.push(latex.slice(start));
          return rows;
        }

        field.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === 'ArrowDown') scheduleCaretScroll();
          if (normalWritingMode && event.key === 'Backspace') {
            if (currentRowIsEmpty()) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return;
            }
            requestAnimationFrame(() => {
              if (normalWritingMode && field.mode !== 'text') field.executeCommand(['switchMode', 'text']);
            });
          }
          if (normalWritingMode && event.key === 'Enter') {
            // Let MathLive create its native multiline row, then keep text mode active there.
            requestAnimationFrame(() => {
              if (field.mode !== 'text') field.executeCommand(['switchMode', 'text']);
            });
          }
        }, true);

        field.onScrollIntoView = scheduleCaretScroll;
        field.addEventListener('input', () => {
          saveDraft();
          scheduleCaretScroll();
        });
        field.addEventListener('change', saveDraft);
        field.addEventListener('selection-change', scheduleCaretScroll);
        titleInput.addEventListener('input', saveDraft);
        document.querySelector('#save-note').addEventListener('click', saveNote);
        document.querySelector('#new-note').addEventListener('click', newNote);
        document.querySelector('#export-note').addEventListener('click', downloadTex);
        document.querySelector('#import-note').addEventListener('click', () => filePicker.click());
        document.querySelector('#new-folder').addEventListener('click', () => openFolderDialog());
        const sidebarToggle = document.querySelector('#sidebar-toggle');
        sidebarToggle.addEventListener('click', event => {
          event.stopPropagation();
          if (isMobileLayout()) document.body.classList.toggle('sidebar-open');
          else document.body.classList.toggle('sidebar-collapsed');
          syncSidebarButton();
        });
        window.addEventListener('resize', () => {
          if (isMobileLayout()) document.body.classList.remove('sidebar-collapsed');
          else document.body.classList.remove('sidebar-open');
          syncSidebarButton();
        });
        document.querySelector('#cancel-folder').addEventListener('click', () => folderDialog.close());
        folderForm.addEventListener('submit', event => {
          event.preventDefault();
          const name = folderNameInput.value.trim();
          if (!name) return;
          folders.push({ id: makeId(), name, parentId: folderParentForDialog, expanded: true, createdAt: Date.now() });
          const parent = folders.find(folder => folder.id === folderParentForDialog);
          if (parent) parent.expanded = true;
          writeFolders();
          folderDialog.close();
          renderTree();
        });
        addDropBehavior(document.querySelector('#folder-root-drop'), null, true);
        addDropBehavior(document.querySelector('#unfiled-heading'), null, true);
        document.querySelector('#workspace').addEventListener('click', () => closeMobileSidebar());

        const current = readStoredJson(currentKey, null);
        const storedNote = current?.id ? notes.find(note => note.id === current.id) : null;
        if (storedNote) {
          currentId = storedNote.id;
          titleInput.value = current.title || storedNote.title || '';
          field.value = current.latex || storedNote.latex || '\\displaylines{}';
          saveStatus.textContent = 'Saved';
        } else if (current && typeof current.latex === 'string') {
          titleInput.value = current.title || '';
          field.value = current.latex || '\\displaylines{}';
          saveStatus.textContent = 'Draft restored';
        } else {
          try { field.value = localStorage.getItem(oldDraftKey) || '\\displaylines{}'; }
          catch (_) { field.value = '\\displaylines{}'; }
        }

        renderTree();
        syncSidebarButton();
        focusEditor();
      });
    })();
  </script>
</body>
</html>
